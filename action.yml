name: "Code Vitals"
description: "Run Code Vitals after Successful Deployment"
author: "Code Vitals"
branding:
  icon: "activity"
  color: "blue"
  
inputs:
  command:
    description: "Command to Code Vitals Performance Check (must generate summary json)"
    required: true
    default: "tools/main.js"
  summary_path:
    description: "Path to artifacts generated by the Code Vitals run"
    required: true
    default: "artifacts/lighthouse/summary.json"
  fail_thresholds:
    description: "Fail the action if thresholds fail"
    required: false
    default: "true"

runs:
  using: "node20"
  main: "tools/main.js"